name: Backend Lambda Deployment with SAM
on:
  push:
    branches:
      - main
    paths:
      - backend/serverless-resume-website/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend/serverless-resume-website
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install AWS SAM CLI
        run: |
          pip install aws-sam-cli
          sam --version
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build SAM application
        run: sam build

      - name: Deploy to AWS
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
      
      - name: Verify deployment
        run: |
          set -euo pipefail

          STACK_NAME="serverless-resume-web-app"

          echo "Fetching CloudFormation outputs for stack: $STACK_NAME"
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' --output table || true

          # Try common output keys (adjust to match your SAM template Outputs)
          API_URL="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl' || OutputKey=='ApiURL' || OutputKey=='ApiEndpoint' || OutputKey=='ServerlessRestApi'].OutputValue | [0]" \
            --output text || true)"

          if [ -z "${API_URL:-}" ] || [ "$API_URL" = "None" ]; then
            echo "ERROR: Could not find API URL in CloudFormation outputs."
            echo "Fix by ensuring your SAM template defines an Output with a known key (e.g., ApiUrl) that contains the full base URL."
            exit 1
          fi

          # Ensure trailing slash
          case "$API_URL" in
            */) ;;
            *) API_URL="${API_URL}/" ;;
          esac

          echo "Testing API at: ${API_URL}counter"
          RESPONSE_CODE="$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}counter")"

          if [ "$RESPONSE_CODE" -eq 200 ]; then
            echo "Health check passed! API is working."
          else
            echo "Health check failed with status: $RESPONSE_CODE"
            exit 1
          fi
