name: Backend Lambda Deployment with SAM
on:
  push:
    branches:
      - main
    paths:
      - backend/serverless-resume-website/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend/serverless-resume-website
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install AWS SAM CLI
        run: |
          pip install aws-sam-cli
          sam --version
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build SAM application
        run: sam build

      - name: Deploy to AWS
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
      
      - name: Verify deployment
        run: |
          set -euo pipefail

          STACK_NAME="serverless-resume-web-app"

          echo "Fetching CloudFormation outputs for stack: $STACK_NAME"
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' --output table || true

          # Try common output keys that hold a full URL.
          # NOTE: ServerlessRestApi is intentionally excluded here — it is an
          # API ID, not a URL, and is handled by the ID-based fallback below.
          API_URL="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl' || OutputKey=='ApiURL' || OutputKey=='ApiEndpoint'].OutputValue | [0]" \
            --output text || true)"

          API_URL="$(echo "${API_URL:-}" | xargs || true)"

          # Fallback: derive URL from SAM implicit API if no output is present
          if [ -z "${API_URL:-}" ] || [ "$API_URL" = "None" ] || [ "$API_URL" = "null" ]; then
            REST_API_ID="$(aws cloudformation describe-stack-resources \
              --stack-name "$STACK_NAME" \
              --query "StackResources[?LogicalResourceId=='ServerlessRestApi'].PhysicalResourceId | [0]" \
              --output text || true)"

            REST_API_ID="$(echo "${REST_API_ID:-}" | xargs || true)"
            if [ -n "${REST_API_ID:-}" ] && [ "$REST_API_ID" != "None" ] && [ "$REST_API_ID" != "null" ]; then
              API_URL="https://${REST_API_ID}.execute-api.${AWS_REGION}.amazonaws.com/Prod/"
            fi
          fi

          if [ -z "${API_URL:-}" ] || [ "$API_URL" = "None" ] || [ "$API_URL" = "null" ]; then
            echo "ERROR: Could not find API URL in CloudFormation outputs."
            echo "Fix by ensuring your SAM template defines an Output key like ApiUrl."
            exit 1
          fi

          # Ensure trailing slash
          case "$API_URL" in
            */) ;;
            *) API_URL="${API_URL}/" ;;
          esac

          echo "Testing API at: ${API_URL}counter"
          RESPONSE_CODE="$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}counter")"

          if [ "$RESPONSE_CODE" -eq 200 ]; then
            echo "Health check passed! API is working."
          else
            echo "Health check failed with status: $RESPONSE_CODE"
            exit 1
          fi
